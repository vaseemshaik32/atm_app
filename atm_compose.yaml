services:
  atm_db:
    image: postgres:16-alpine
    container_name: atm_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks: [atm-net]

  atm_redis:
    image: redis:7-alpine
    container_name: atm_redis
    command: redis-server --requirepass ${REDIS_PASSWORD}
    networks: [atm-net]

  atm_ms_auth_32:
    image: markelof32/atmappbackendv32:auth
    container_name: atm_ms_auth_32
    environment:
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [atm-net]
    depends_on: [atm_db, atm_redis]

  atm_ms_ws_32:
    image: markelof32/atmappbackendv32:ws
    container_name: atm_ms_ws_32
    environment:
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
    networks: [atm-net]
    depends_on: [atm_db, atm_redis]

  atm_ms_exchanges_32:
    image: markelof32/atmappbackendv32:exchanges
    container_name: atm_ms_exchanges_32
    environment:
      POSTGRES_USERNAME: ${POSTGRES_USERNAME}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      REDIS_HOST: ${REDIS_HOST}
      REDIS_PORT: ${REDIS_PORT}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    networks: [atm-net]
    depends_on: [atm_db, atm_redis]

  atm_gateway_32:
    build: ./nginx
    container_name: atm_gateway_32
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
    networks: [atm-net]
    depends_on: [atm_ms_auth_32, atm_ms_ws_32, atm_ms_exchanges_32]

  atm_frontend_32:
    image: markelof32/atmappfrontendv32:latest
    container_name: atm_frontend_32
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt
      - ./nginx_frontend/nginx.conf:/etc/nginx/conf.d/default.conf
    networks: [atm-net]
    depends_on: [atm_gateway_32]

networks:
  atm-net:
