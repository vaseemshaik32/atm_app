worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/json;
    sendfile        on;
    keepalive_timeout 65;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;

        # === CORS Headers for ALL API Paths ===
        set $cors_origin "";
        if ($http_origin ~* "^(https?://localhost(:[0-9]+)?|https://chicken-fish.site)$") {
            set $cors_origin $http_origin;
        }


        add_header 'Access-Control-Allow-Origin' "$cors_origin" always;
        add_header 'Access-Control-Allow-Credentials' 'true' always;
        add_header 'Access-Control-Allow-Methods' 'GET, POST, PUT, DELETE, OPTIONS' always;
        add_header 'Access-Control-Allow-Headers' 'Content-Type, Authorization, X-Requested-With' always;

        # === Handle Preflight ===
        if ($request_method = OPTIONS ) {
            return 204;
        }

        # === Auth Service ===
       location ^~ /api/auth/ {

    proxy_pass http://atm_ms_auth_32:1000;
    proxy_set_header Host            $host;
    proxy_set_header Cookie          $http_cookie;
}


        # === Internal Auth Verification (for auth_request) ===
        location = /auth {
            internal;
            proxy_pass http://atm_ms_auth_32:1000/api/auth/verify;  # No trailing slash!
            proxy_method GET;  # Explicitly force GET (since you changed auth to accept GET)
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header Host $host;  # Critical for cookie/domain handling
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $http_cookie;
        }

        location /api/exchanges/needcash {
            auth_request /auth;
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header X-User-ID $user_id;
            proxy_set_header Host $host;
            proxy_method PUT;
            proxy_pass http://atm_ms_exchanges_32:6000;  # No trailing slash!
        }

        location /api/exchanges/needdigital {
            auth_request /auth;
            auth_request_set $user_id $upstream_http_x_user_id;
            proxy_set_header Host $host;
            proxy_set_header X-User-ID $user_id;
            proxy_method PUT;
            proxy_pass http://atm_ms_exchanges_32:6000;
        }

        location /ws/ {
            proxy_pass http://atm_ms_ws_32:5000;  # Replace 9000 with your container’s actual port
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header Cookie $http_cookie;
        }

        # === Health Check ===
        location = / {
            return 200 'Gateway is running';
            add_header Content-Type text/plain;
        }
    }
}
